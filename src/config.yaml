site:
  name: Lukáš Valčo
  site: 'https://lukasvalco.cz'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Lukáš Valčo
    template: '%s — Lukáš Valčo'
  description: 'Fotovoltaický expert ČFA a energetický poradce. Sdílím znalosti z praxe v technické podpoře solárních systémů — fotovoltaika, energetika, drony a AI nástroje.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Lukáš Valčo
    images:
      - url: '~/assets/images/og-image.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: cs
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'kategorie' # Category main path /kategorie/some-category
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'stitek' # Tag main path /stitek/some-tag
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
